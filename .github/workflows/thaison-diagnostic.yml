name: Temporary Thai Son final regression verification
on:
  push:
    paths: ['.github/workflows/thaison-diagnostic.yml']
  workflow_dispatch:
jobs:
  inspect-public-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate TypeScript unit tests
        uses: actions/checkout@v4
      - name: Run tests
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npx tsx --test tests/thaison-form.test.ts
          npm run lint
